version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./samples:/samples
      - ./eval:/eval
      - nyayalens-data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/nyayalens.db
    restart: unless-stopped

volumes:
  nyayalens-data:
